
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'LiveChatSimulator-Android-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip -q LiveChatSimulator-Android-Source.zip -d .
          ls -la

      - name: Compilar APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          build-root-directory: LiveChatSimulator
          arguments: assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveChatSimulator-APK
          path: LiveChatSimulator/app/build/outputs/apk/debug/app-debug.apk
